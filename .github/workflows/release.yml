name: Release

# A tag v* builds the signed APK and Play Store bundle and attaches them to a
# draft GitHub release. The upload key comes from the secrets of the `release`
# environment, which only v* tags may use: RUBIYOMI_KEYSTORE_BASE64 (the .jks,
# base64), RUBIYOMI_KEYSTORE_PASSWORD, RUBIYOMI_KEY_ALIAS and
# RUBIYOMI_KEY_PASSWORD. Actions are pinned to commits, as they run beside the key.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;28.2.13676358"
      - run: cargo install cargo-ndk --locked
      - name: Build the bundled dictionaries
        run: cargo xtask dict
      - name: Unpack the upload key
        env:
          KEYSTORE: ${{ secrets.RUBIYOMI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "RUBIYOMI_KEYSTORE_BASE64 isn't set" >&2; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RUBIYOMI_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the APK and the bundle
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          RUBIYOMI_KEYSTORE_PASSWORD: ${{ secrets.RUBIYOMI_KEYSTORE_PASSWORD }}
          RUBIYOMI_KEY_ALIAS: ${{ secrets.RUBIYOMI_KEY_ALIAS }}
          RUBIYOMI_KEY_PASSWORD: ${{ secrets.RUBIYOMI_KEY_PASSWORD }}
        run: |
          tool/android-build.sh release
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk "out/rubiyomi-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/rubiyomi-${GITHUB_REF_NAME}.aab"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: out/*
