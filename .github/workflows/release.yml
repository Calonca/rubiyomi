name: Release

# A tag v* builds every download and attaches them to a draft GitHub release, each with
# its .sha256 (the apps' update check verifies against it):
#   Rubiyomi-<version>.apk               Android (the Play Store build, as an APK)
#   Rubiyomi-<version>.aab               the Play Store bundle
#   Rubiyomi-<version>-x86_64.AppImage   Linux (looks for updates)
#   Rubiyomi-<version>-x86_64.exe        Windows, one portable file, unsigned (looks for updates)
# The upload key comes from the secrets of the `release` environment, which only v* tags
# may use: RUBIYOMI_KEYSTORE_BASE64 (the .jks, base64), RUBIYOMI_KEYSTORE_PASSWORD,
# RUBIYOMI_KEY_ALIAS and RUBIYOMI_KEY_PASSWORD. Actions are pinned to commits, as they run
# beside the key.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  dict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # They change only with xtask, the dictionary code or a dependency (lindera's IPADIC).
      - id: dict
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: dist/dict
          key: dict-${{ hashFiles('xtask/**', 'crates/core/src/dict/**', 'Cargo.lock') }}
      - name: Build the bundled dictionaries
        if: steps.dict.outputs.cache-hit != 'true'
        run: cargo xtask dict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dict
          path: dist/dict

  android:
    needs: dict
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;28.2.13676358"
      - run: cargo install cargo-ndk --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dict
          path: dist/dict
      - name: Unpack the upload key
        env:
          KEYSTORE: ${{ secrets.RUBIYOMI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "RUBIYOMI_KEYSTORE_BASE64 isn't set" >&2; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RUBIYOMI_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the APK and the bundle
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          RUBIYOMI_KEYSTORE_PASSWORD: ${{ secrets.RUBIYOMI_KEYSTORE_PASSWORD }}
          RUBIYOMI_KEY_ALIAS: ${{ secrets.RUBIYOMI_KEY_ALIAS }}
          RUBIYOMI_KEY_PASSWORD: ${{ secrets.RUBIYOMI_KEY_PASSWORD }}
        run: |
          tool/android-build.sh release
          version="${GITHUB_REF_NAME#v}"
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Rubiyomi-$version.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/Rubiyomi-$version.aab"
          cd out && sha256sum "Rubiyomi-$version.apk" > "Rubiyomi-$version.apk.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android
          path: out/*

  linux:
    needs: dict
    # The oldest runner, so the AppImage needs no newer glibc than it has.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: System libraries for the desktop window
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dict
          path: dist/dict
      - run: cargo build --release -p rubiyomi --features update-check
      - run: tool/appimage.sh target/release/rubiyomi out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: out/*

  windows:
    needs: dict
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dict
          path: dist/dict
      # The dictionaries go inside the .exe, so it runs as a single file.
      - run: cargo build --release -p rubiyomi --features update-check,embed-dict
      - run: |
          name="Rubiyomi-${GITHUB_REF_NAME#v}-x86_64.exe"
          mkdir out
          cp target/release/rubiyomi.exe "out/$name"
          cd out && sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: out/*

  release:
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows
          path: out
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: out/*
