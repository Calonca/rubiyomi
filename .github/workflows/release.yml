name: Release

# A tag v* builds the signed APK and Play Store bundle and attaches them to a
# draft GitHub release. The upload key comes from the repository's secrets:
# RUBIYOMI_KEYSTORE_BASE64 (the .jks, base64), RUBIYOMI_KEYSTORE_PASSWORD,
# RUBIYOMI_KEY_ALIAS and RUBIYOMI_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;28.2.13676358"
      - run: cargo install cargo-ndk --locked
      - name: Build the bundled dictionaries
        run: cargo xtask dict
      - name: Unpack the upload key
        env:
          KEYSTORE: ${{ secrets.RUBIYOMI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "RUBIYOMI_KEYSTORE_BASE64 isn't set" >&2; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RUBIYOMI_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the APK and the bundle
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          RUBIYOMI_KEYSTORE_PASSWORD: ${{ secrets.RUBIYOMI_KEYSTORE_PASSWORD }}
          RUBIYOMI_KEY_ALIAS: ${{ secrets.RUBIYOMI_KEY_ALIAS }}
          RUBIYOMI_KEY_PASSWORD: ${{ secrets.RUBIYOMI_KEY_PASSWORD }}
        run: |
          tool/android-build.sh release
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk "out/rubiyomi-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/rubiyomi-${GITHUB_REF_NAME}.aab"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
