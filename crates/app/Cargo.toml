[package]
name = "rubiyomi"
description = "A Japanese reader with furigana and a popup dictionary."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "rubiyomi"
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "rubiyomi"
path = "src/main.rs"
test = false

[dependencies]
rubiyomi-core.workspace = true
egui.workspace = true
log.workspace = true
egui_material_icons = "0.8"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow", "wayland", "x11"] }
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow", "android-native-activity"] }
android_logger = "0.15"
winit = { version = "0.30", features = ["android-native-activity"] }
jni = "0.21"

[lints]
workspace = true
