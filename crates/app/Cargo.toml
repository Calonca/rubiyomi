[package]
name = "rubiyomi"
description = "A simple app for reading Japanese books in EPUB."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "rubiyomi"
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "rubiyomi"
path = "src/main.rs"
test = false

[dependencies]
rubiyomi-core.workspace = true
egui.workspace = true
log.workspace = true
image.workspace = true
serde_json.workspace = true
memmap2 = "0.9"
egui_material_icons = "0.8"

[features]
# The GitHub builds (AppImage, .exe, APK) look for updates; store and packaged builds never do.
update-check = []
# The Windows .exe carries the dictionaries inside, to run as a single file.
embed-dict = []

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow", "wayland"] }
env_logger = "0.11"
rfd = "0.17"
keyring-core = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow", "android-native-activity"] }
android_logger = "0.15"
winit = { version = "0.30", features = ["android-native-activity"] }
jni = "0.21"

[lints]
workspace = true
