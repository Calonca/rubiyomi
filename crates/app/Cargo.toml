[package]
name = "rubiyomi"
description = "A reader for Japanese books, with furigana and a dictionary."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "rubiyomi"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rubiyomi"
path = "src/main.rs"
required-features = ["desktop"]

[features]
# The desktop window: GTK 4 on Linux, Win32 on Windows. Off for Android, so that build needs no GTK headers.
desktop = [
    "dep:nsh-platform-linux",
    "dep:nsh-platform-windows",
    "dep:env_logger",
    "dep:keyring-core",
    "dep:zbus-secret-service-keyring-store",
    "dep:windows-native-keyring-store",
]

# The headless runs' environment variables (src/hooks.rs), and the keys in a file. Never on Android.
dev-hooks = []

# The update check, for the GitHub desktop downloads only (AppImage, .exe). Never on Android.
update-check = []

# The dictionaries inside the binary, for the single-file Windows .exe.
embed-dict = []

[dependencies]
rubiyomi-core.workspace = true
log.workspace = true
serde_json.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
nsh-core = { git = "https://github.com/longbridge/native-shell", rev = "c85e3f7dc878a638198cc129f835ec0afdfbd5a6" }
nsh-base = { git = "https://github.com/longbridge/native-shell", rev = "c85e3f7dc878a638198cc129f835ec0afdfbd5a6", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = { git = "https://github.com/longbridge/native-shell", rev = "c85e3f7dc878a638198cc129f835ec0afdfbd5a6", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = { version = "0.11", optional = true }
keyring-core = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/longbridge/native-shell", rev = "c85e3f7dc878a638198cc129f835ec0afdfbd5a6", default-features = false, optional = true }
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"], optional = true }

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { git = "https://github.com/longbridge/native-shell", rev = "c85e3f7dc878a638198cc129f835ec0afdfbd5a6", default-features = false, optional = true }
windows-native-keyring-store = { version = "1.1", optional = true }

[lints]
workspace = true
