[package]
name = "rubiyomi"
description = "A reader for Japanese books, with furigana and a dictionary."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "rubiyomi"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rubiyomi"
path = "src/main.rs"
required-features = ["desktop"]

[features]
# The GTK 4 window, off for Android so that build needs no GTK headers.
desktop = ["dep:nsh-platform-linux", "dep:env_logger", "dep:keyring-core", "dep:zbus-secret-service-keyring-store"]

# The headless runs' environment variables (src/hooks.rs), and the keys in a file. Never on Android.
dev-hooks = []

[dependencies]
rubiyomi-core.workspace = true
log.workspace = true
serde_json.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
nsh-core = { git = "https://github.com/longbridge/native-shell", rev = "c015f2c5e9e5f9f6f7656a4d2baabb3e4e4f28d0" }
nsh-base = { git = "https://github.com/longbridge/native-shell", rev = "c015f2c5e9e5f9f6f7656a4d2baabb3e4e4f28d0", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = { git = "https://github.com/longbridge/native-shell", rev = "c015f2c5e9e5f9f6f7656a4d2baabb3e4e4f28d0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/longbridge/native-shell", rev = "c015f2c5e9e5f9f6f7656a4d2baabb3e4e4f28d0", default-features = false, optional = true }
env_logger = { version = "0.11", optional = true }
keyring-core = { version = "1", optional = true }
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"], optional = true }

[lints]
workspace = true
