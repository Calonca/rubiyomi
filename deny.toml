[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-linux-android",
]
all-features = false

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OFL-1.1",
]
# egui's built-in UI font, Ubuntu Light; a permissive font licence (see THIRD_PARTY_NOTICES.md).
exceptions = [{ crate = "epaint_default_fonts", allow = ["Ubuntu-font-1.0"] }]
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
